services:
  tor-evidence-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tor-evidence-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CHROME_PATH=/usr/bin/chromium
    volumes:
      - tor_storage:/app/server/storage

volumes:
  tor_storage:
    name: tor_evidence_storage
